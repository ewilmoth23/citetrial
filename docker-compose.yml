services:
  api:
    build: ./apps/api
    environment:
      CITETRAIL_ENVIRONMENT: production
      CITETRAIL_DATA_DIR: /data
      CITETRAIL_MODEL_PROVIDER: ${CITETRAIL_MODEL_PROVIDER:-ollama}
      CITETRAIL_MODEL_BASE_URL: ${CITETRAIL_MODEL_BASE_URL:-http://host.docker.internal:11434}
      CITETRAIL_MODEL_NAME: ${CITETRAIL_MODEL_NAME:-qwen2.5:7b}
      CITETRAIL_MODEL_API_KEY: ${CITETRAIL_MODEL_API_KEY:-}
      CITETRAIL_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - citetrail_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  web:
    build: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  citetrail_data:
