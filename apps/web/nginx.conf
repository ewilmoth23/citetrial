server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  # Alpine's default MIME table does not identify ECMAScript modules. With
  # `nosniff` enabled, serving the PDF.js worker as an octet stream prevents
  # every production browser from loading the module.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location /api/ { proxy_pass http://api:8000/api/; proxy_set_header X-Request-ID $request_id; }
  location /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ /index.html; }
}
