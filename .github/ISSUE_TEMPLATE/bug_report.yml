name: Bug report
description: Report a reproducible CiteTrail defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes: { label: What happened?, description: Do not include private source text or credentials. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: CiteTrail version and operating system }
    validations: { required: true }
