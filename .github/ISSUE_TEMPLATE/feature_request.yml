name: Feature request
description: Propose a focused research workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes: { label: Research need, description: Describe the user problem before the implementation. }
    validations: { required: true }
  - type: textarea
    id: provenance
    attributes: { label: Provenance and citation implications }
    validations: { required: true }
  - type: textarea
    id: security
    attributes: { label: Security, privacy, and responsible-AI implications }
